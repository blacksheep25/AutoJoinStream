name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: zip "AutoJoinStream-${GITHUB_REF_NAME}.zip" index.ts README.md LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AutoJoinStream-${GITHUB_REF_NAME}.zip" --generate-notes
