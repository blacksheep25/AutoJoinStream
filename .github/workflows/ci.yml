name: Vencord compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: vencord/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Install plugin in Vencord
        run: |
          mkdir -p vencord/src/userplugins/autoJoinStream
          cp plugin/index.ts vencord/src/userplugins/autoJoinStream/index.ts

      - name: Lint plugin
        working-directory: vencord
        run: pnpm exec eslint src/userplugins/autoJoinStream/index.ts

      - name: Type check Vencord
        working-directory: vencord
        run: pnpm testTsc

      - name: Build Vencord
        working-directory: vencord
        run: pnpm build
